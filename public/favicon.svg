<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Comedy Castle ticket">
  <!--
    The club's own ticket stock: white paper with an orange band down each side.
    The bands sit where they really do - the stock is 5 3/8" wide, orange to
    1.0000", white to 3.9375", orange to 4.8125", then a white strip to the
    edge. Scaled to a 28-wide body: 5.21 wide, then 22.51 to 27.07.
    Kept plain on purpose; at 16px the bands are what identify it.
  -->
  <defs>
    <clipPath id="body">
      <rect x="2" y="7.5" width="28" height="17" rx="2.4" />
    </clipPath>
  </defs>

  <rect x="2" y="7.5" width="28" height="17" rx="2.4" fill="#fdfcfa" />
  <g clip-path="url(#body)">
    <rect x="2" y="7.5" width="5.21" height="17" fill="#e87d33" />
    <rect x="22.51" y="7.5" width="4.56" height="17" fill="#e87d33" />
  </g>
  <rect x="2" y="7.5" width="28" height="17" rx="2.4" fill="none"
        stroke="#221d19" stroke-width="1.6" />
</svg>
